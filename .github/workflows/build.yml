name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak proyek dari zip
        run: |
          rm -rf proj && mkdir proj
          unzip -q spritesheet-project.zip -d proj
          SETTINGS=$(find proj \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)
          echo "ROOT=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK debug
        working-directory: ${{ env.ROOT }}
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SpriteSheet-APK
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/app-debug.apk
